[project]
name = "proximal-flap-solo"
version = "1.1.0"
description = "A single autonomous bird continuously playing a Flappy Bird-style game."
requires-python = ">=3.10"
dependencies = ["pygame>=2.5.2,<3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
